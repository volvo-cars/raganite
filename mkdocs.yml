site_name: Raganite
site_description: Index documents into a knowledge graph and retrieve the passages that answer a question.
site_url: https://volvo-cars.github.io/raganite
repo_url: https://github.com/volvo-cars/raganite
repo_name: volvo-cars/raganite
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Home: index.md
  - Get started:
      - getting-started/installation.md
      - getting-started/quickstart.md
  - Guides:
      - guides/configuration.md
      - guides/indexing.md
      - guides/retrieval.md
      - guides/namespaces.md
      - guides/providers.md
      - guides/neo4j.md
      - guides/benchmarking.md
      - guides/run-benchmarks.md
  - Explanation:
      - explanation/question-to-passages.md
  - Reference:
      - reference/python-api.md
      - reference/cli.md
      - reference/benchmark-cli.md
  - Project:
      - contributing.md
      - changelog.md
      - Future work: future-work.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables

plugins:
  - search

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn
