name: Package

on:
  push:
    branches: [main]
  release:
    # GitHub does not run workflows for draft releases. Publishing the release
    # starts pre-release checks, then the PyPI upload.
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.release.id || github.ref }}
  # Never interrupt an in-progress upload when another merge arrives.
  cancel-in-progress: false

jobs:
  source:
    name: Validate release source
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && github.event.action == 'published' &&
       github.event.release.draft == false)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out the exact build source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate main ancestry and release version
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          event = os.environ["EVENT_NAME"]
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if event == "release":
              if os.environ["PRERELEASE"] == "true":
                  raise SystemExit("Pre-releases are not published. Publish a stable release.")
              tag = os.environ["RELEASE_TAG"]
              tagged = subprocess.check_output(
                  ["git", "rev-parse", f"refs/tags/{tag}^{{commit}}"],
                  text=True,
              ).strip()
              if tagged != sha:
                  raise SystemExit("Checkout must be the tagged release commit")

          ancestor = subprocess.run(
              ["git", "merge-base", "--is-ancestor", sha, "origin/main"],
          )
          if ancestor.returncode != 0:
              raise SystemExit("Release commit must already be on main")

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if event == "release":
              if not re.fullmatch(r"\d+\.\d+\.\d+", version):
                  raise SystemExit("Only stable X.Y.Z versions can be released by this workflow")
              tag = os.environ["RELEASE_TAG"]
              if tag != f"v{version}":
                  raise SystemExit(
                      f"Release tag must be v{version} to match project.version (got {tag})"
                  )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\nsha={sha}\n")
          PY

  checks:
    name: Pre-release checks
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  build:
    name: Build distribution
    needs: [source, checks]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Set up dependencies
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"
      - name: Install production dependencies
        run: uv sync --no-dev
      - name: Read package version
        id: metadata
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={project['version']}\n")
          PY
      - name: Build wheel and source distribution
        run: uv build
      - name: Validate distribution metadata
        run: uvx twine check --strict dist/*
      - name: Save distributions
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: raganite-${{ steps.metadata.outputs.version }}-${{ needs.source.outputs.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Record deployment status
        if: github.event_name != 'release'
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          {
            echo "## Package build"
            echo "Version: $PACKAGE_VERSION"
            echo "Wheel and source distribution are available as workflow artifacts."
            echo "Pushes to main and manual runs build only. They do not publish."
            echo "Publishing a GitHub Release runs these checks again, then uploads to PyPI."
          } >> "$GITHUB_STEP_SUMMARY"

  # Trusted publishing: no PyPI token is stored in GitHub.
  # Configure a PyPI pending publisher for workflow package.yml
  # and environment package-publish before the first release.
  # This job does not check out the repository.
  publish:
    name: Publish to PyPI
    needs: [source, build]
    if: github.event_name == 'release' && needs.build.result == 'success'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: package-publish
    permissions:
      id-token: write
      contents: write
      actions: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.27"
      - name: Download the validated build from this run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Publish to PyPI and attach the distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
          UV_NO_PROGRESS: "1"
        shell: bash
        run: |
          set -euo pipefail
          uv publish --publish-url https://upload.pypi.org/legacy/ dist/*
          gh release upload "$RELEASE_TAG" dist/* --clobber
          {
            echo "## Published"
            echo "PyPI package for $RELEASE_TAG is uploaded from the checked commit $RELEASE_SHA."
          } >> "$GITHUB_STEP_SUMMARY"
