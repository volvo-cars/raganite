name: Set up Python and uv
description: Configure Python and uv to download packages from official PyPI.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.13"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.9.27"
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Configure official PyPI
      shell: bash
      run: |
        echo "UV_DEFAULT_INDEX=https://pypi.org/simple" >> "$GITHUB_ENV"
        echo "PIP_INDEX_URL=https://pypi.org/simple" >> "$GITHUB_ENV"
